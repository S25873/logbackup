<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>캐릭터 모음 생성기</title>
<meta name="description" content="캐릭터 설정표를 만들고 이미지로 저장하세요.">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
  @import url('https://rsms.me/inter/inter.css');
  @import url('//fonts.googleapis.com/earlyaccess/nanummyeongjo.css');
  @import url('https://cdn.jsdelivr.net/gh/MonadABXY/mona-font/web/mona.css');
  @font-face{font-family:'Pretendard';font-weight:400;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Regular.woff2') format('woff2')}
  @font-face{font-family:'Pretendard';font-weight:700;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Bold.woff2') format('woff2')}
  @font-face{font-family:'Paperozi';font-weight:400;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2') format('woff2')}
  @font-face{font-family:'Paperozi';font-weight:700;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2')}
  @font-face{font-family:'Ridibatang';font-weight:normal;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_twelve@1.0/RIDIBatang.woff') format('woff')}
  @font-face{font-family:'OngleipKonkon';font-weight:normal;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2412-1@1.0/Ownglyph_corncorn-Rg.woff2') format('woff2')}
  @font-face{font-family:'GangwonEducationSaeum';font-weight:normal;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2201-2@1.0/GangwonEduSaeeum_OTFMediumA.woff') format('woff')}
  @font-face{font-family:'SchoolSafetyPictureDiary';font-weight:normal;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-5@1.0/HakgyoansimGeurimilgiTTF-R.woff2') format('woff2')}
  @font-face{font-family:'PfStardust';font-weight:normal;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/PFStardust.woff') format('woff')}

  *, *::before, *::after { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  body {
    margin:0; padding:24px 16px 60px;
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    color:#5a4d4a; background:#faf7f6; line-height:1.5;
  }
  @media (max-width:560px){ body{padding:14px 10px 48px;} }

  #cc-gen {
    --line:#f1e3e0; --ink:#5a4d4a; --ink-soft:#b29a96;
    --pink:#e8a6a0; --pink-soft:#fdf3f1; --field:#fdf8f7;
    max-width:1080px; width:100%; margin:0 auto;
  }

  .cc-head{text-align:center; margin-bottom:20px;}
  .cc-title{font-size:20px; font-weight:700; letter-spacing:-.02em; color:var(--ink); margin:0;}
  .cc-title b{color:var(--pink);}
  .cc-sub{font-size:12px; color:var(--ink-soft); margin:5px 0 0; line-height:1.6;}

  .cc-layout{display:flex; flex-direction:column; gap:20px;}

  /* editor */
  .cc-editor{
    background:var(--field); border:1px solid var(--line);
    border-radius:16px; padding:18px; min-width:0;
  }
  .cc-editor h2{font-size:13px; font-weight:700; margin:0 0 14px; color:var(--ink);}
  .cc-editor-head{display:flex; align-items:center; gap:7px; margin:0 0 14px;}
  .cc-editor-head h2{margin:0;}
  .cc-reset{margin-left:auto; border:1px solid var(--line); background:#fff; color:var(--ink-soft); border-radius:6px; padding:2px 8px; font-size:11px; font-weight:700; cursor:pointer; font-family:inherit; transition:background .12s,color .12s,border-color .12s; white-space:nowrap; line-height:1.4;}
  .cc-reset:hover{background:var(--pink-soft); color:var(--pink); border-color:var(--pink);}
  .cc-reset:active{transform:translateY(1px);}
  .cc-field{margin-bottom:12px;}
  .cc-field label{display:block; font-size:11.5px; color:var(--ink-soft); margin:0 0 5px; font-weight:600;}
  #cc-gen input[type="text"], #cc-gen textarea, #cc-gen select{
    width:100%; background:#fff; border:1px solid var(--line); color:var(--ink);
    border-radius:10px; padding:9px 12px; font-size:13.5px; font-family:inherit;
    transition:border-color .15s; -webkit-appearance:none; appearance:none;
  }
  #cc-gen input:focus, #cc-gen textarea:focus, #cc-gen select:focus{outline:none; border-color:var(--pink);}
  #cc-gen textarea{resize:vertical; min-height:70px; line-height:1.55;}
  #cc-gen select{cursor:pointer; background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath fill='%23b29a96' d='M0 0l5 6 5-6z'/%3E%3C/svg%3E"); background-repeat:no-repeat; background-position:right 12px center; padding-right:30px;}
  .g-imgpick{display:flex; align-items:center; gap:12px; background:#fff; border:1px dashed var(--line); border-radius:10px; padding:9px; cursor:pointer; margin:0; transition:border-color .15s;}
  .g-imgpick:hover{border-color:var(--pink);}
  .g-imgpick .g-thumb{width:44px; height:44px; border-radius:8px; flex-shrink:0; background:var(--pink-soft) center/cover; display:flex; align-items:center; justify-content:center; color:var(--pink); font-size:19px;}
  .g-imgpick span{font-size:12px; color:var(--ink-soft);}

  /* tag input */
  .cc-taginput{display:flex; gap:6px;}
  .cc-taginput input{flex:1;}
  .cc-tagadd{
    flex:none; width:52px; border:none; border-radius:10px; background:var(--pink);
    color:#fff; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .cc-tagadd:active{transform:translateY(1px);}
  .cc-taglist{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .cc-tagchip{
    display:inline-flex; align-items:center; gap:5px; background:#fff;
    border:1px solid var(--line); border-radius:999px; padding:4px 6px 4px 11px;
    font-size:12px; font-weight:600; color:var(--ink);
  }
  .cc-tagchip .cc-chip-x{
    width:16px; height:16px; border-radius:50%; background:var(--pink-soft);
    color:var(--pink); display:flex; align-items:center; justify-content:center;
    font-size:12px; line-height:1; cursor:pointer; flex:none;
  }
  .cc-tagchip .cc-chip-x:hover{background:var(--pink); color:#fff;}

  /* theme presets */
  .cc-themes{display:flex; gap:6px; flex-wrap:wrap;}
  .cc-theme{
    flex:1 1 0; min-width:56px; height:34px; border-radius:9px; border:1px solid var(--line);
    cursor:pointer; font-size:11px; font-weight:700; display:flex; align-items:center;
    justify-content:center; font-family:inherit; padding:0 4px; transition:box-shadow .12s;
  }
  .cc-theme.active{box-shadow:0 0 0 2px var(--pink);}

  /* accent chips */
  .cc-accents{display:flex; gap:7px; flex-wrap:wrap;}
  .cc-accent{
    width:30px; height:30px; border-radius:50%; border:1px solid var(--line);
    background:#fff; cursor:pointer; padding:0; display:flex; align-items:center;
    justify-content:center; transition:box-shadow .12s; flex:none;
  }
  .cc-accent .cc-accent-dot{width:18px; height:18px; border-radius:50%; display:block;}
  .cc-accent.active{box-shadow:0 0 0 2px var(--pink); border-color:transparent;}

  /* character list */
  .cc-list{margin-top:6px; display:flex; flex-direction:column; gap:7px;}
  .cc-list-item{
    display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--line);
    border-radius:11px; padding:8px 10px;
  }
  .cc-list-item.editing{border-color:var(--pink); box-shadow:0 0 0 1px var(--pink);}
  .cc-li-face{
    width:36px; height:36px; border-radius:9px; flex:none; background:var(--pink-soft) center/cover no-repeat;
    display:flex; align-items:center; justify-content:center; color:var(--pink); font-size:15px;
  }
  .cc-li-body{flex:1; min-width:0;}
  .cc-li-name{font-size:13px; font-weight:700; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .cc-li-name .cc-li-age{font-weight:400; color:var(--ink-soft); font-size:11.5px; margin-left:5px;}
  .cc-li-desc{font-size:11px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px;}
  .cc-li-btns{display:flex; gap:2px; flex:none;}
  .cc-li-btn{border:none; background:transparent; color:var(--ink-soft); cursor:pointer; font-size:14px; padding:4px 5px; border-radius:6px; font-family:inherit;}
  .cc-li-btn:hover{background:var(--pink-soft); color:var(--pink);}
  .cc-list-empty{
    text-align:center; color:var(--ink-soft); font-size:12px;
    padding:18px; border:1px dashed var(--line); border-radius:11px; background:#fff; margin-top:6px;
  }

  .cc-btn{
    border:none; border-radius:11px; padding:11px 14px; font-size:13.5px;
    font-weight:700; cursor:pointer; font-family:inherit; transition:filter .15s, transform .1s;
  }
  .cc-btn-primary{background:var(--pink); color:#fff; box-shadow:0 8px 20px -10px rgba(232,166,160,.9);}
  .cc-btn-primary:hover{filter:brightness(1.04);}
  .cc-btn-primary:active{transform:translateY(1px);}
  .cc-btn-ghost{background:#fff; color:var(--pink); border:1px solid var(--pink);}
  .cc-btn-ghost:hover{background:var(--pink-soft);}
  .cc-btn:disabled{opacity:.5; pointer-events:none;}

  .cc-add-row{display:flex; gap:8px;}
  .cc-add-row .cc-btn-primary{flex:1;}
  .cc-editor-actions{display:flex; gap:8px;}
  .cc-editor-actions .cc-btn{flex:1;}

  .cc-save-row{display:flex; gap:10px; margin-bottom:12px;}
  .cc-save-row .cc-btn{flex:1 1 0;}

  .cc-split-note{
    font-size:11px; color:var(--pink); background:var(--pink-soft);
    border:1px solid var(--line); border-radius:9px; padding:8px 11px;
    margin-bottom:12px; line-height:1.5; font-weight:600;
  }

  .cc-preview{
    background:var(--pink-soft); border:1px solid var(--line); border-radius:16px;
    padding:16px; overflow:hidden; max-width:100%; min-width:0;
  }
  .cc-preview-label{
    font-size:10.5px; font-weight:700; letter-spacing:.12em; color:var(--pink);
    text-transform:uppercase; margin-bottom:12px; text-align:center;
  }
  .cc-pages{display:flex; flex-direction:column; gap:18px;}
  .cc-page-tag{font-size:10.5px; color:var(--ink-soft); font-weight:600; margin-bottom:6px; text-align:center;}
  .cc-page-stage{width:100%; max-width:100%; overflow:hidden; border-radius:10px;}
  .cc-page-stage-in{transform-origin:top left;}

  /* sheet (캡처 대상) */
  .cc-sheet{
    width:720px; padding:44px; display:flex; flex-direction:column; gap:14px;
    box-shadow:0 12px 36px -22px rgba(120,90,85,.5); border-radius:4px;
    background:var(--t-sheet,#ffffff); --t-desc:#5d5b57;
  }
  .cc-sheet.cc-exporting{box-shadow:none; border-radius:0;}
  .cc-sheet.cc-dark{--t-desc:#c7c0b8;}
  .cc-card{
    border-radius:14px; padding:20px 22px; display:flex; gap:20px; position:relative; align-items:flex-start;
    background:var(--t-card,#ffffff); border:1px solid var(--t-cardline,#f0e6e3);
  }
  .cc-card .cc-face{
    width:104px; height:104px; border-radius:12px; flex-shrink:0;
    background:var(--t-face,#f2efe9) center/cover no-repeat; display:flex;
    align-items:center; justify-content:center; color:var(--t-mute,#c0bcb4);
    font-size:34px; overflow:hidden;
  }
  .cc-card .cc-face img{width:100%; height:100%; object-fit:cover; display:block;}
  .cc-card .cc-body{flex:1; min-width:0; padding-top:2px;}
  .cc-card .cc-name-row{display:flex; align-items:baseline; gap:10px; margin-bottom:3px; flex-wrap:wrap;}
  .cc-card .cc-name{font-size:19px; font-weight:700; letter-spacing:-.01em; color:var(--t-name,#2b2926);}
  .cc-card .cc-age{font-size:13px; color:var(--t-mute,#c0bcb4);}
  .cc-card .cc-rule{width:26px; height:3px; background:var(--t-rule,#dedad2); border-radius:2px; margin:11px 0 12px;}
  .cc-card .cc-desc{font-size:14px; color:var(--t-desc,#6f6a63); line-height:1.7; margin-bottom:13px; white-space:pre-wrap;}
  .cc-card .cc-tags{display:flex; flex-wrap:wrap; gap:6px;}
  .cc-card .cc-tag{
    font-size:11.5px; font-weight:600; padding:3px 11px; border-radius:999px;
    color:var(--t-tagink,#5a564f); background:var(--t-tagbg,#f0ede7);
  }

  .cc-empty{
    text-align:center; color:var(--ink-soft); font-size:13px;
    padding:44px 20px; border:1px dashed var(--line); border-radius:14px; background:#fff;
  }
  .cc-renderRoot{position:fixed; left:-99999px; top:0; pointer-events:none;}

  /* iOS 저장 모달 */
  .cc-modal-overlay{
    position:fixed; inset:0; z-index:99999; background:rgba(0,0,0,.65);
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    padding:20px; overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .cc-modal-box{
    background:#fff; border-radius:16px; padding:18px; max-width:560px; width:100%;
    margin:auto; text-align:center;
  }
  .cc-modal-tip{font-size:13px; color:var(--ink); font-weight:600; margin-bottom:14px; line-height:1.6;}
  .cc-modal-imgs{display:flex; flex-direction:column; gap:14px;}
  .cc-modal-imgs img{width:100%; border-radius:8px; border:1px solid var(--line);}
  .cc-modal-close{
    margin-top:14px; border:none; border-radius:10px; padding:11px 20px;
    background:var(--pink); color:#fff; font-size:13.5px; font-weight:700;
    cursor:pointer; font-family:inherit;
  }
  .cc-modal-page-label{font-size:11px; color:var(--ink-soft); font-weight:600; margin-bottom:4px;}
</style>
</head>
<body>
<div id="cc-gen">
  <div class="cc-head">
    <p class="cc-title">캐릭터 모음 생성기 <b>&hearts;</b></p>
    <p class="cc-sub">설정은 새로고침해도 유지돼요.<br>단, 시간이 지나면 초기화될 수 있어요.</p>
  </div>
  <div class="cc-layout">
    <!-- editor -->
    <div class="cc-editor">
      <div class="cc-editor-head">
        <h2 id="cc-editor-title">캐릭터 추가</h2>
        <button id="cc-clearBtn" class="cc-reset" title="모든 카드를 삭제합니다" type="button">↺ 초기화</button>
      </div>
      <div class="cc-field">
        <label>이미지</label>
        <label class="g-imgpick" for="cc-imgInput">
          <div id="cc-thumb" class="g-thumb">＋</div>
          <span id="cc-imgName">클릭해서 이미지 업로드</span>
        </label>
        <input id="cc-imgInput" hidden accept="image/*" type="file">
      </div>
      <div class="cc-field"><label>이름</label><input id="cc-fName" type="text" placeholder="캐릭터 이름"></div>
      <div class="cc-field"><label>정보</label><input id="cc-fAge" type="text" placeholder="나이 등 간단 정보"></div>
      <div class="cc-field"><label>설정 내용</label><textarea id="cc-fDesc" placeholder="설정 내용을 적어주세요."></textarea></div>
      <div class="cc-field">
        <label>해시태그</label>
        <div class="cc-taginput"><input id="cc-fTagInput" autocomplete="off" type="text" placeholder="태그 입력 후 추가"><button id="cc-tagAdd" class="cc-tagadd" type="button">추가</button></div>
        <div id="cc-tagList" class="cc-taglist"></div>
      </div>
      <div class="cc-field">
        <label>글꼴</label>
        <select id="cc-fFont">
          <option value="'Pretendard',sans-serif">프리텐다드</option>
          <option value="'Inter',sans-serif">인터</option>
          <option value="'Paperozi',sans-serif">페이퍼로지</option>
          <option value="'Nanum Myeongjo','나눔명조',serif">나눔명조</option>
          <option value="'Ridibatang',serif">리디바탕</option>
          <option value="'OngleipKonkon',sans-serif">온글잎 콘콘</option>
          <option value="'GangwonEducationSaeum',sans-serif">강원교육새음체</option>
          <option value="'SchoolSafetyPictureDiary',sans-serif">학교안심 그림일기</option>
          <option value="'Mona12','Mona12 Text KR',sans-serif">모나</option>
          <option value="'PfStardust',sans-serif">스타더스트</option>
        </select>
      </div>
      <div class="cc-field"><label>테마 프리셋</label><div id="cc-themes" class="cc-themes"></div></div>
      <div class="cc-field"><label>캐릭터 포인트</label><div id="cc-accents" class="cc-accents"></div></div>
      <div id="cc-addRow" class="cc-add-row"><button id="cc-addBtn" class="cc-btn cc-btn-primary" type="button">캐릭터 추가</button></div>
      <div id="cc-editActions" class="cc-editor-actions" style="display:none"><button id="cc-saveEditBtn" class="cc-btn cc-btn-primary" type="button" style="flex:2">수정 완료</button><button id="cc-cancelEditBtn" class="cc-btn cc-btn-ghost" type="button">취소</button></div>
      <div style="margin-top:16px; border-top:1px solid var(--line); padding-top:16px">
        <label style="display:block; font-size:11.5px; color:var(--ink-soft); font-weight:600; margin-bottom:2px">추가한 캐릭터</label>
        <div id="cc-list" class="cc-list"></div>
        <div id="cc-listEmpty" class="cc-list-empty">아직 추가한 캐릭터가 없어요. 위에서 첫 캐릭터를 추가해보세요.</div>
      </div>
    </div>
    <!-- preview -->
    <div style="min-width:0">
      <div class="cc-save-row">
        <button id="cc-exportPng" class="cc-btn cc-btn-primary" type="button">PNG로 저장</button>
        <button id="cc-exportJpg" class="cc-btn cc-btn-ghost" type="button">JPG로 저장</button>
      </div>
      <div id="cc-splitNote" class="cc-split-note" style="display:none"></div>
      <div class="cc-preview">
        <div class="cc-preview-label">Preview</div>
        <div id="cc-pages" class="cc-pages"></div>
        <div id="cc-empty" class="cc-empty">아직 카드가 없어요. 위에서 첫 캐릭터를 추가해보세요.</div>
      </div>
    </div>
  </div>
  <div id="cc-renderRoot" class="cc-renderRoot"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function(){
  var PER_PAGE = Infinity;
  var STORE_KEY = 'cc-gen-state-v2';
  var $ = function(id){ return document.getElementById(id); };

  /* ---- 환경 감지 ---- */
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isMobile = /Mobi|Android/i.test(navigator.userAgent) || isIOS;

  /* ---- themes ---- */
  var THEMES = [
    { id:'mono', label:'기본', swatch:'#ffffff', swInk:'#2b2926', dark:false,
      vars:{'--t-sheet':'#ffffff','--t-card':'#ffffff','--t-cardline':'#e7e5e0','--t-face':'#f2f1ee','--t-name':'#1f1e1c','--t-age':'#a9a7a1','--t-mute':'#bdbbb6'} },
    { id:'dark', label:'다크', swatch:'#26221f', swInk:'#ffffff', dark:true,
      vars:{'--t-sheet':'#221f1c','--t-card':'#2c2825','--t-cardline':'#3a3430','--t-face':'#3a3430','--t-name':'#f4f1ec','--t-age':'#8a827a','--t-mute':'#6a625b'} }
  ];
  var ACCENTS = [
    {id:'gray',label:'그레이',light:{rule:'#e2e0db',tagbg:'#f3f2ef',tagink:'#7c7a74'},dark:{rule:'#4a423c',tagbg:'#3a3430',tagink:'#e6ddd2'}},
    {id:'pink',label:'핑크',light:{rule:'#f4dcd8',tagbg:'#fdf1ee',tagink:'#d89189'},dark:{rule:'#6b4a45',tagbg:'#4a332f',tagink:'#eaa9a1'}},
    {id:'coral',label:'코랄',light:{rule:'#f8ddce',tagbg:'#fdf1ea',tagink:'#e0916a'},dark:{rule:'#6d493a',tagbg:'#4a332a',tagink:'#eaa079'}},
    {id:'apricot',label:'애프리콧',light:{rule:'#f6e3c8',tagbg:'#fdf5e8',tagink:'#d6a865'},dark:{rule:'#6a5330',tagbg:'#443722',tagink:'#e6c584'}},
    {id:'butter',label:'버터',light:{rule:'#f0e6be',tagbg:'#fbf6df',tagink:'#c4a94f'},dark:{rule:'#5f5730',tagbg:'#3d3922',tagink:'#ddc76a'}},
    {id:'sage',label:'세이지',light:{rule:'#dfe6cf',tagbg:'#f1f5e8',tagink:'#93ab6d'},dark:{rule:'#4a553a',tagbg:'#333c28',tagink:'#b3ca8f'}},
    {id:'mint',label:'민트',light:{rule:'#d5ebe1',tagbg:'#ecf6f1',tagink:'#6fb094'},dark:{rule:'#3a5a4c',tagbg:'#2a3d35',tagink:'#8fceb5'}},
    {id:'sky',label:'스카이',light:{rule:'#d1e6ef',tagbg:'#e9f4f9',tagink:'#6aa8c2'},dark:{rule:'#385360',tagbg:'#293b44',tagink:'#8ecadf'}},
    {id:'blue',label:'블루',light:{rule:'#d8e1ef',tagbg:'#edf1f9',tagink:'#7e97c4'},dark:{rule:'#3a465f',tagbg:'#2a3245',tagink:'#9fb5da'}},
    {id:'lavender',label:'라벤더',light:{rule:'#e2ddf2',tagbg:'#f2effa',tagink:'#9a8bcf'},dark:{rule:'#4a4463',tagbg:'#353046',tagink:'#b3a7e0'}},
    {id:'lilac',label:'라일락',light:{rule:'#ecd8ea',tagbg:'#f9eef7',tagink:'#bd8ab5'},dark:{rule:'#5a3f58',tagbg:'#3d2c3b',tagink:'#d0a1cb'}},
    {id:'rose',label:'로즈',light:{rule:'#f4d7e0',tagbg:'#fceef3',tagink:'#d68aa6'},dark:{rule:'#6b4653',tagbg:'#48303a',tagink:'#e6a1bb'}},
    {id:'taupe',label:'토프',light:{rule:'#e6dace',tagbg:'#f5efe7',tagink:'#a68d70'},dark:{rule:'#54463a',tagbg:'#3b3228',tagink:'#cbb08a'}}
  ];

  var state = { chars:[], editingId:null, pendingImg:null, pendingTags:[], pendingAccent:'gray', font:"'Pretendard',sans-serif", theme:'mono' };
  var uid = 1;

  function themeById(id){ for(var i=0;i<THEMES.length;i++) if(THEMES[i].id===id) return THEMES[i]; return THEMES[0]; }
  function accentById(id){ for(var i=0;i<ACCENTS.length;i++) if(ACCENTS[i].id===id) return ACCENTS[i]; return ACCENTS[0]; }

  /* ---- persistence ---- */
  function saveState(){
    try{
      localStorage.setItem(STORE_KEY, JSON.stringify({ chars:state.chars, uid:uid, font:$('cc-fFont').value, theme:state.theme }));
    }catch(e){
      try{ localStorage.setItem(STORE_KEY, JSON.stringify({ chars:state.chars.map(function(c){return Object.assign({},c,{img:null})}), uid:uid, font:$('cc-fFont').value, theme:state.theme })); }catch(e2){}
    }
  }
  function restoreState(){
    try{ var raw=localStorage.getItem(STORE_KEY); if(!raw) return; var d=JSON.parse(raw);
      if(Array.isArray(d.chars)) state.chars=d.chars.map(function(c){if(!c.accent)c.accent='gray';return c;});
      if(d.uid) uid=d.uid; if(d.font){$('cc-fFont').value=d.font; state.font=d.font;}
      if(d.theme) state.theme=(d.theme==='dark')?'dark':'mono';
    }catch(e){}
  }

  /* ---- theme swatches ---- */
  function renderThemes(){
    var w=$('cc-themes'); w.innerHTML='';
    THEMES.forEach(function(t){
      var b=document.createElement('button'); b.type='button';
      b.className='cc-theme'+(t.id===state.theme?' active':'');
      b.style.background=t.swatch; b.style.color=t.swInk;
      b.style.borderColor=t.dark?'transparent':'var(--line)';
      b.textContent=t.label;
      b.addEventListener('click',function(){ state.theme=t.id; renderThemes(); renderAccentChips(); render(); saveState(); });
      w.appendChild(b);
    });
  }
  function applyThemeVars(el,id){ var t=themeById(id); for(var k in t.vars) if(t.vars.hasOwnProperty(k)) el.style.setProperty(k,t.vars[k]); if(t.dark) el.classList.add('cc-dark'); else el.classList.remove('cc-dark'); }
  function applyAccent(el,id,dk){ var a=accentById(id), c=dk?a.dark:a.light; el.style.setProperty('--t-rule',c.rule); el.style.setProperty('--t-tagbg',c.tagbg); el.style.setProperty('--t-tagink',c.tagink); }

  /* ---- image upload ---- */
  $('cc-imgInput').addEventListener('change',function(e){
    var f=e.target.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(ev){ state.pendingImg=ev.target.result; $('cc-thumb').style.backgroundImage='url('+ev.target.result+')'; $('cc-thumb').textContent=''; $('cc-imgName').textContent=f.name; };
    r.readAsDataURL(f);
  });

  /* ---- pending tags ---- */
  function renderPendingTags(){
    var l=$('cc-tagList'); l.innerHTML='';
    state.pendingTags.forEach(function(tag,idx){
      var ch=document.createElement('span'); ch.className='cc-tagchip';
      var lb=document.createElement('span'); lb.textContent='#'+tag; ch.appendChild(lb);
      var x=document.createElement('span'); x.className='cc-chip-x'; x.textContent='×';
      x.addEventListener('click',function(){ state.pendingTags.splice(idx,1); renderPendingTags(); });
      ch.appendChild(x); l.appendChild(ch);
    });
  }
  function addPendingTag(){
    var inp=$('cc-fTagInput'), raw=inp.value.trim(); if(!raw) return;
    raw.split(/[,\s]+/).map(function(t){return t.replace(/^#/,'').trim()}).filter(Boolean).forEach(function(t){ if(state.pendingTags.indexOf(t)===-1) state.pendingTags.push(t); });
    inp.value=''; renderPendingTags(); inp.focus();
  }
  $('cc-tagAdd').addEventListener('click',addPendingTag);
  $('cc-fTagInput').addEventListener('keydown',function(e){ if(e.key==='Enter'){e.preventDefault();addPendingTag();} });

  /* ---- accent chips ---- */
  function renderAccentChips(){
    var w=$('cc-accents'); if(!w) return; w.innerHTML='';
    var dk=themeById(state.theme).dark;
    ACCENTS.forEach(function(a){
      var c=dk?a.dark:a.light, b=document.createElement('button'); b.type='button';
      b.className='cc-accent'+(a.id===state.pendingAccent?' active':'');
      b.title=a.label; b.setAttribute('aria-label',a.label);
      var dot=document.createElement('span'); dot.className='cc-accent-dot'; dot.style.background=c.tagink;
      b.appendChild(dot);
      b.addEventListener('click',function(){
        state.pendingAccent=a.id;
        if(state.editingId!==null){ var ch=state.chars.find(function(x){return x.id===state.editingId}); if(ch){ch.accent=a.id; render(); saveState();} }
        renderAccentChips();
      });
      w.appendChild(b);
    });
  }

  /* ---- form ---- */
  function clearForm(){
    $('cc-fName').value=''; $('cc-fAge').value=''; $('cc-fDesc').value=''; $('cc-fTagInput').value='';
    state.pendingImg=null; state.pendingTags=[]; state.pendingAccent='gray';
    $('cc-thumb').style.backgroundImage=''; $('cc-thumb').textContent='＋';
    $('cc-imgName').textContent='클릭해서 이미지 업로드';
    $('cc-imgInput').value=''; renderPendingTags(); renderAccentChips();
  }
  function readForm(){
    return { name:$('cc-fName').value.trim()||'이름 없음', age:$('cc-fAge').value.trim(),
      desc:$('cc-fDesc').value.trim()||'설정 내용이 없습니다.', tags:state.pendingTags.slice(),
      accent:state.pendingAccent, img:state.pendingImg };
  }

  $('cc-addBtn').addEventListener('click',function(){
    if(!$('cc-fName').value.trim()&&!$('cc-fDesc').value.trim()&&!state.pendingTags.length) return;
    state.chars.push(Object.assign({id:uid++},readForm())); clearForm(); render(); saveState();
  });

  function startEdit(id){
    var c=state.chars.find(function(x){return x.id===id}); if(!c) return;
    state.editingId=id; state.pendingImg=c.img; state.pendingTags=(c.tags||[]).slice(); state.pendingAccent=c.accent||'gray';
    $('cc-fName').value=c.name==='이름 없음'?'':c.name; $('cc-fAge').value=c.age;
    $('cc-fDesc').value=c.desc==='설정 내용이 없습니다.'?'':c.desc;
    if(c.img){$('cc-thumb').style.backgroundImage='url('+c.img+')'; $('cc-thumb').textContent=''; $('cc-imgName').textContent='이미지 있음';}
    renderPendingTags(); renderAccentChips();
    $('cc-editor-title').textContent='카드 수정'; $('cc-addRow').style.display='none'; $('cc-editActions').style.display='flex';
    try{$('cc-editor-title').scrollIntoView({behavior:'smooth',block:'nearest'})}catch(e){}
  }
  $('cc-saveEditBtn').addEventListener('click',function(){
    var c=state.chars.find(function(x){return x.id===state.editingId}); if(c) Object.assign(c,readForm());
    exitEdit(); render(); saveState();
  });
  $('cc-cancelEditBtn').addEventListener('click',exitEdit);
  function exitEdit(){ state.editingId=null; clearForm(); $('cc-editor-title').textContent='캐릭터 추가'; $('cc-addRow').style.display='flex'; $('cc-editActions').style.display='none'; }

  function remove(id){ state.chars=state.chars.filter(function(c){return c.id!==id}); render(); saveState(); }
  $('cc-clearBtn').addEventListener('click',function(){
    if(state.editingId!==null){exitEdit(); return;}
    if(state.chars.length&&confirm('모든 카드를 삭제할까요?')){state.chars=[]; render(); saveState();}
  });
  $('cc-fFont').addEventListener('change',function(){state.font=$('cc-fFont').value; render(); saveState();});

  /* ---- render ---- */
  function esc(s){ return String(s).replace(/[&<>"]/g,function(m){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[m]}); }
  function cardHtml(c){
    var face=c.img?'<div class="cc-face"><img src="'+c.img+'" alt=""></div>':'<div class="cc-face">◍</div>';
    var tags=(c.tags||[]).map(function(t){return'<span class="cc-tag">#'+esc(t)+'</span>'}).join('');
    return face+'<div class="cc-body"><div class="cc-name-row"><span class="cc-name">'+esc(c.name)+'</span>'+(c.age?'<span class="cc-age">'+esc(c.age)+'</span>':'')+'</div><div class="cc-rule"></div><div class="cc-desc">'+esc(c.desc)+'</div><div class="cc-tags">'+tags+'</div></div>';
  }
  function chunkPages(){ var p=[]; for(var i=0;i<state.chars.length;i+=PER_PAGE) p.push(state.chars.slice(i,i+PER_PAGE)); return p; }
  function buildSheet(chars){
    var s=document.createElement('div'); s.className='cc-sheet'; s.style.fontFamily=state.font;
    applyThemeVars(s,state.theme); var dk=themeById(state.theme).dark;
    chars.forEach(function(c){ var cd=document.createElement('div'); cd.className='cc-card'; cd.innerHTML=cardHtml(c); cd.setAttribute('data-id',c.id); applyAccent(cd,c.accent||'gray',dk); s.appendChild(cd); });
    return s;
  }

  function render(){
    var n=state.chars.length; $('cc-empty').style.display=n?'none':'block';
    var pages=chunkPages(), note=$('cc-splitNote');
    if(pages.length>1){note.style.display='block'; note.textContent='💡 '+n+'명 → 3명씩 '+pages.length+'장으로 저장돼요.';}
    else note.style.display='none';
    var pe=$('cc-pages'); pe.innerHTML='';
    pages.forEach(function(chars,pi){
      var bl=document.createElement('div');
      if(pages.length>1){var tg=document.createElement('div'); tg.className='cc-page-tag'; tg.textContent=(pi+1)+' / '+pages.length; bl.appendChild(tg);}
      var st=document.createElement('div'); st.className='cc-page-stage';
      var inn=document.createElement('div'); inn.className='cc-page-stage-in';
      var sh=buildSheet(chars); inn.appendChild(sh); st.appendChild(inn); bl.appendChild(st); pe.appendChild(bl);
      sh.querySelectorAll('.cc-card').forEach(function(cd){ cd.style.cursor='pointer'; cd.addEventListener('click',function(){startEdit(parseInt(cd.getAttribute('data-id'),10))}); });
    });
    renderCharList(); fitStages();
  }

  function renderCharList(){
    var l=$('cc-list'), em=$('cc-listEmpty'); if(!l) return; l.innerHTML='';
    if(!state.chars.length){em.style.display='block'; return;} em.style.display='none';
    state.chars.forEach(function(c){
      var it=document.createElement('div'); it.className='cc-list-item'+(c.id===state.editingId?' editing':'');
      var fc=document.createElement('div'); fc.className='cc-li-face';
      if(c.img) fc.style.backgroundImage='url('+c.img+')'; else fc.textContent='◍'; it.appendChild(fc);
      var bd=document.createElement('div'); bd.className='cc-li-body';
      var nm=document.createElement('div'); nm.className='cc-li-name'; nm.innerHTML=esc(c.name)+(c.age?'<span class="cc-li-age">'+esc(c.age)+'</span>':'');
      var ds=document.createElement('div'); ds.className='cc-li-desc'; ds.textContent=(c.desc||'').replace(/\n/g,' ');
      bd.appendChild(nm); bd.appendChild(ds); it.appendChild(bd);
      var bt=document.createElement('div'); bt.className='cc-li-btns';
      var eb=document.createElement('button'); eb.className='cc-li-btn'; eb.type='button'; eb.title='수정'; eb.textContent='✎'; eb.addEventListener('click',function(){startEdit(c.id)});
      var db=document.createElement('button'); db.className='cc-li-btn'; db.type='button'; db.title='삭제'; db.textContent='✕'; db.addEventListener('click',function(){if(state.editingId===c.id)exitEdit(); remove(c.id);});
      bt.appendChild(eb); bt.appendChild(db); it.appendChild(bt); l.appendChild(it);
    });
  }

  var _fr, _fitR=0;
  function fitStages(){
    if(_fr) cancelAnimationFrame(_fr);
    _fr=requestAnimationFrame(function(){
      var stgs=document.querySelectorAll('#cc-gen .cc-page-stage'), any0=false;
      stgs.forEach(function(st){ var inn=st.querySelector('.cc-page-stage-in'), sh=inn.querySelector('.cc-sheet'), av=st.clientWidth;
        if(!av){any0=true;return;} var sc=Math.min(1,av/720); inn.style.transform='scale('+sc+')'; st.style.height=(sh.offsetHeight*sc)+'px'; });
      if(any0&&_fitR<20){_fitR++;setTimeout(fitStages,60)} else _fitR=0;
    });
  }
  window.addEventListener('resize',fitStages);
  window.addEventListener('load',fitStages);

  /* ---- export ---- */
  function waitForImages(el){
    var imgs=el.querySelectorAll('img'); if(!imgs.length) return Promise.resolve();
    return Promise.all([].map.call(imgs,function(img){
      if(img.complete&&img.naturalWidth) return Promise.resolve();
      return new Promise(function(r){img.addEventListener('load',r,{once:true}); img.addEventListener('error',r,{once:true});});
    }));
  }

  /* canvas → Blob 변환 */
  function canvasToBlob(canvas, type, quality){
    return new Promise(function(resolve){
      if(canvas.toBlob){ canvas.toBlob(resolve, type, quality); }
      else {
        var url=canvas.toDataURL(type,quality);
        var bin=atob(url.split(',')[1]), arr=new Uint8Array(bin.length);
        for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
        resolve(new Blob([arr],{type:type}));
      }
    });
  }

  /* Web Share API로 파일 공유 (iOS Safari 15+) */
  async function tryShareBlob(blob, filename){
    try{
      var file=new File([blob], filename, {type:blob.type});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file]});
        return true;
      }
    }catch(e){
      if(e.name==='AbortError') return true; /* 사용자가 취소한 것이므로 성공 취급 */
    }
    return false;
  }

  /* iOS 모달 (Web Share 안 될 때 fallback) */
  function showIOSModal(dataUrls){
    var old=document.getElementById('cc-ios-modal'); if(old) old.remove();
    var ov=document.createElement('div'); ov.id='cc-ios-modal'; ov.className='cc-modal-overlay';
    var bx=document.createElement('div'); bx.className='cc-modal-box';
    var tip=document.createElement('div'); tip.className='cc-modal-tip'; tip.textContent='이미지를 길게 눌러서 저장해주세요 📲';
    bx.appendChild(tip);
    var iw=document.createElement('div'); iw.className='cc-modal-imgs';
    dataUrls.forEach(function(url,i){
      if(dataUrls.length>1){var lb=document.createElement('div'); lb.className='cc-modal-page-label'; lb.textContent=(i+1)+' / '+dataUrls.length; iw.appendChild(lb);}
      var img=document.createElement('img'); img.src=url; iw.appendChild(img);
    });
    bx.appendChild(iw);
    var cb=document.createElement('button'); cb.type='button'; cb.className='cc-modal-close'; cb.textContent='닫기';
    cb.addEventListener('click',function(){ov.remove();}); bx.appendChild(cb);
    ov.appendChild(bx); ov.addEventListener('click',function(e){if(e.target===ov)ov.remove();});
    document.getElementById('cc-gen').appendChild(ov);
  }

  async function doExport(type, btn){
    if(!state.chars.length){alert('저장할 카드가 없어요.'); return;}
    var pngBtn=$('cc-exportPng'), jpgBtn=$('cc-exportJpg');
    pngBtn.disabled=true; jpgBtn.disabled=true;
    var orig=btn.textContent; btn.textContent='저장 중…';
    var bgColor=themeById(state.theme).vars['--t-sheet']||'#ffffff';
    var renderScale=isMobile?3:4;
    var quality=type==='image/jpeg'?0.96:undefined;
    var ext=type==='image/jpeg'?'jpg':'png';
    var iosFallbackUrls=[];

    try{
      if(document.fonts&&document.fonts.ready) await document.fonts.ready;
      var pages=chunkPages(), root=$('cc-renderRoot');

      for(var i=0;i<pages.length;i++){
        root.innerHTML='';
        var sheet=buildSheet(pages[i]); sheet.classList.add('cc-exporting'); root.appendChild(sheet);
        await waitForImages(sheet);
        await new Promise(function(r){requestAnimationFrame(function(){requestAnimationFrame(r)})});

        var canvas=await html2canvas(sheet, {
          backgroundColor:bgColor, scale:renderScale, useCORS:true, logging:false,
          width:sheet.offsetWidth, height:sheet.offsetHeight, imageTimeout:0
        });

        var filename=pages.length>1 ? '캐릭터_설정표_'+(i+1)+'-'+pages.length+'.'+ext : '캐릭터_설정표.'+ext;

        if(isIOS){
          /* iOS: Web Share API 시도 → 실패 시 모달 fallback */
          var blob=await canvasToBlob(canvas, type, quality);
          var shared=await tryShareBlob(blob, filename);
          if(!shared){
            iosFallbackUrls.push(canvas.toDataURL(type,quality));
          }
        } else {
          /* PC / Android: 다운로드 */
          var blob2=await canvasToBlob(canvas, type, quality);
          var url=URL.createObjectURL(blob2);
          var link=document.createElement('a'); link.download=filename; link.href=url; link.click();
          setTimeout(function(){URL.revokeObjectURL(url)},5000);
          await new Promise(function(r){setTimeout(r,300)});
        }
      }
      root.innerHTML='';
      if(iosFallbackUrls.length) showIOSModal(iosFallbackUrls);
    }catch(e){
      alert('저장 중 문제가 생겼어요.\n('+((e&&e.message)||e)+')');
    }finally{
      pngBtn.disabled=false; jpgBtn.disabled=false; btn.textContent=orig;
    }
  }

  $('cc-exportPng').addEventListener('click',function(){doExport('image/png',this)});
  $('cc-exportJpg').addEventListener('click',function(){doExport('image/jpeg',this)});

  /* ---- init ---- */
  restoreState(); renderThemes(); renderPendingTags(); renderAccentChips(); render();
})();
</script>
</body>
</html>
